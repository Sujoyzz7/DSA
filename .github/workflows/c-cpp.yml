name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build meson autoconf automake libtool pkg-config

    - name: Build and test (auto-detect build system)
      run: |
        set -euo pipefail
        echo "Detecting build system..."

        run_make_checks() {
          echo "Running make -j"
          make -j

          if [ -f Makefile ] && grep -qE '^[[:space:]]*check:' Makefile; then
            echo "Running make check"
            make check
          else
            echo "No 'check' target in Makefile; skipping make check"
          fi

          if [ -f Makefile ] && grep -qE '^[[:space:]]*distcheck:' Makefile; then
            echo "Running make distcheck"
            make distcheck
          else
            echo "No 'distcheck' target in Makefile; skipping make distcheck"
          fi
        }

        if [ -f configure ]; then
          echo "Found ./configure — running it"
          chmod +x configure || true
          ./configure
          run_make_checks

        elif [ -f configure.ac ] || [ -f configure.in ]; then
          echo "Found configure.ac/configure.in — generating configure with autoreconf"
          autoreconf -i
          chmod +x configure || true
          ./configure
          run_make_checks

        elif [ -f CMakeLists.txt ]; then
          echo "Found CMakeLists.txt — configuring with CMake"
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -- -j
          if command -v ctest >/dev/null 2>&1; then
            echo "Running ctest"
            ctest --test-dir build --output-on-failure
          else
            echo "ctest not available; skipping CMake tests"
          fi

        elif [ -f meson.build ]; then
          echo "Found meson.build — configuring with Meson"
          meson setup build
          meson compile -C build
          meson test -C build

        elif [ -f Makefile ]; then
          echo "Found Makefile — building with make"
          run_make_checks

        else
          echo "No supported build system files found (configure, configure.ac, CMakeLists.txt, meson.build, Makefile)." >&2
          echo "Contents of repository root:"
          ls -la
          exit 1
        fi
